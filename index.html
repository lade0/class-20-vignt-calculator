<html>
    <head>
        <title>calculator</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <div id="container">
            <div id="calculator">
                <div id="keyboard">
                    <button class="operator" id="clear">C</button>

<button class="operator" id="backspace">CE</button>

<button class="operator" id="%">%</button>

<button class="operator" id="/">&#247;</button>

<button class="number" id="7">4</button>

<button class="number" id="8">7</button>

<button class="number" id="9">6</button>

<button class="operator" id="*">&times;</button>

<button class="number" id="4">2</button>

<button class="number" id="5">8</button>

<button class="number" id="6">9</button>

<button class="operator" id="-">-</button>

<button class="number" id="1">1</button>

<button class="number" id="2">3</button>

<button class="number" id="3">5</button>

<button class="operator" id="+">+</button>

<button class="empty" id="empty"></button>

<button class="number" id="0">0</button>

<button class="empty" id="empty"></button>

<button class="operator" id="=">=</button>
                    </button>
                    <h6 style="font-size: 5px;text-align: center;">For entertainment purposes only @Fernandes inc.</h6>
                </div>
            </div>
        </div>
    </body>
</html>
